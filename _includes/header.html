<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Lora:wght@500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root { --light: #CDCBD6; --orange: #D96846; --olive: #596235; --dark: #2F3020; }
body { background: var(--light); color: var(--dark); font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; line-height: 1.75; }
h1, h2, h3, h4, .post-title, .post-link { font-family: "Lora", Georgia, serif; font-weight: 600; color: var(--dark); letter-spacing: -.01em; }
.page-content a, .page-content a:visited { color: var(--dark); text-decoration: underline; text-decoration-color: var(--orange); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.page-content a:hover { background: var(--orange); text-decoration: none; }
.page-content h2 { border-left: 6px solid var(--orange); padding-left: .7rem; }
.post-link, .page-content a.post-link { text-decoration: none; font-size: 1.6rem; }
.post-meta { color: var(--dark); font-size: .8rem; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }
.post-list > li { border-bottom: 2px solid var(--olive); padding-bottom: 1.6rem; margin-bottom: 1.6rem; }
.post-list > li:last-child { border-bottom: none; }
blockquote { border-left: 4px solid var(--orange); color: var(--dark); }

.site-header { background: var(--dark); border-top: 5px solid var(--orange); border-bottom: none; padding: .9rem 0; min-height: 0; }
.top-nav { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1.6rem; width: min(1100px, 96vw); margin: 0 auto; }
.top-nav a, .top-nav a:visited { text-decoration: none; color: var(--light); }
.top-nav .nav-brand { font-family: "Special Elite", "Courier New", Courier, monospace; font-size: 1.35rem; }
.nav-right { margin-left: auto; display: flex; flex-wrap: wrap; gap: .4rem 1.6rem; align-items: center; }
.nav-right a { font-size: .95rem; }
.nav-right a:hover, .top-nav .nav-brand:hover { color: var(--orange); }
.dd { position: relative; }
.dd .menu { display: none; position: absolute; right: 0; top: 100%; background: var(--dark); border: 2px solid var(--orange); padding: .4rem 0; min-width: 190px; z-index: 20; }
.dd:hover .menu, .dd:focus-within .menu { display: block; }
.dd .menu a { display: block; padding: .4rem 1rem; white-space: nowrap; }

.site-footer { background: var(--dark); color: var(--light); border-top: 5px solid var(--orange); margin-top: 3rem; }
.site-footer a, .site-footer h2, .site-footer .contact-list, .site-footer .social-media-list, .site-footer .p-name { color: var(--light); }
</style>
<header class="site-header">
  <nav class="top-nav">
    <a class="nav-brand" href="{{ '/' | relative_url }}">Thu Trang HA - Paige</a>
    <div class="nav-right">
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/posts/' | relative_url }}">Posts</a>
      <div class="dd">
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <div class="menu">
          <a href="{{ '/research/' | relative_url }}">CV and Overview</a>
          <a href="{{ '/cartographies/' | relative_url }}">C/artographies</a>
        </div>
      </div>
      <a href="{{ '/photos/' | relative_url }}">Photography</a>
    </div>
  </nav>
</header>
