<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;line-height:1.8;color:#3D3932;background-color:#F4F0E6}
    .wrapper{max-width:780px}
    h1,h2,h3,h4,.site-title,.post-title,.post-link{font-family:"Lora",Georgia,serif;font-weight:500;letter-spacing:-0.02em}
    a,a:visited{color:#344B38;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
    a:hover{color:#6B7654;text-decoration-thickness:2px}
    .site-header{border-top:3px solid #344B38;border-bottom:1px solid #DED7C9}
    .site-title,.site-title:visited{color:#344B38;font-size:1.65rem;font-weight:600}
    .site-nav .page-link{color:#5B554A;font-weight:500}
    .site-nav .page-link:hover{color:#344B38}
    .site-title,.site-nav .page-link,.post-link{text-decoration:none}
    .post-list-heading{font-family:"DM Sans",sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;color:#898274}
    .post-list>li{margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid #DED7C9}
    .post-list>li:last-child{border-bottom:none}
    .post-link{font-size:1.7rem;line-height:1.4}
    .post-meta{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:#898274}
    .post-title{font-size:2.4rem;line-height:1.3}
    .post-content h2{font-size:1.65rem;margin-top:2.5rem;color:#344B38}
    .post-content p{margin-bottom:1.4rem}
    blockquote{border-left:3px solid #A18B68;color:#5B554A;font-family:"Lora",Georgia,serif;font-style:italic;padding-left:1rem}
    .site-footer{border-top:1px solid #DED7C9;margin-top:3rem}
  </style>
</head>
